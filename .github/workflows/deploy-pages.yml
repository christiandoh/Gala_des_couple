# Déploie le site sur GitHub Pages (Settings → Pages → Source: Deploy from a branch → gh-pages)
# URL : https://christiandoh.github.io/Gala_des_couple/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare for static export (API routes not supported on GitHub Pages)
        run: mv app/api ../api_backup

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "1"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: .
